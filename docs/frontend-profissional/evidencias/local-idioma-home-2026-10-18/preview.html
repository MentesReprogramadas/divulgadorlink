<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local, idioma e home — Tem Link Aqui</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#0a192f;font:16px/1.5 system-ui,sans-serif}header{padding:24px;max-width:1200px;margin:auto}h1{font-size:24px;margin:0 0 8px}p{margin:0}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button{min-height:44px;border:1px solid #a4b2c4;background:white;color:#0a192f;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#0a192f;color:white}button:focus-visible,a:focus-visible{outline:3px solid #087f86;outline-offset:3px}main{display:grid;grid-template-columns:minmax(280px,390px) minmax(0,1fr);gap:24px;align-items:start;max-width:1440px;margin:auto;padding:0 24px 40px}figure{margin:0;min-width:0}figcaption{margin-bottom:8px;font-weight:600}img{display:block;width:100%;height:auto;border:1px solid #d7dfeb;border-radius:10px;background:white}a{color:#14547a}@media(max-width:800px){main{grid-template-columns:1fr}figure:first-child{max-width:390px;margin:auto}}
</style><header><h1>Local e idioma, com menos etapas</h1><p>Campos opcionais visíveis, informações nos cards e filtros automáticos na home.</p><nav aria-label="Telas"><button data-view="home" aria-pressed="true">Home</button><button data-view="criar" aria-pressed="false">Criar link</button><button data-view="editar" aria-pressed="false">Editar link</button><button data-view="card" aria-pressed="false">Card do link</button></nav><a href="README.md">Validação, arquivos e reversão</a></header><main><figure><figcaption>Mobile · 390 px</figcaption><img id="mobile" src="home-mobile.png" alt="Home com filtros compactos no mobile"></figure><figure><figcaption>Desktop · 1280 px</figcaption><img id="desktop" src="home-desktop.png" alt="Home com filtros na mesma linha no desktop"></figure></main><script>
const labels={home:'Home com filtros compactos',criar:'Criar link com campos opcionais na etapa de assunto e descrição',editar:'Editar link com campos opcionais e uma ação para salvar',card:'Card com cidade, idioma e participação'};document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));for(const size of ['mobile','desktop']){const image=document.getElementById(size);image.src=button.dataset.view+'-'+size+'.png';image.alt=labels[button.dataset.view]+' — '+size}}));
</script></html>
