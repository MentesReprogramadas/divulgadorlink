<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupos e busca — implementação</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#edf1f6;color:#142339;font:16px/1.5 system-ui,sans-serif}main{max-width:1280px;margin:auto}h1{font-size:26px;margin:0}p{color:#526277;margin:8px 0 20px}label{font-weight:600}select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #b9c6d7;border-radius:8px;background:white;margin:0 0 20px 8px;max-width:100%}select:focus-visible,a:focus-visible{outline:3px solid #146dca;outline-offset:3px}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid #dce3ec;border-radius:12px;background:white}img[data-mobile=true]{max-width:390px;margin:auto}figcaption{margin-top:12px;color:#526277;font-size:14px}a{color:#16496c}@media(max-width:500px){body{padding:16px}select{display:block;margin:8px 0 20px;width:100%}}</style>
<main><h1>Grupos compactos e busca opcional</h1><p>Capturas reais da implementação com dados de teste. A busca começa desativada e, quando ativada, aparece nas duas prévias. As imagens não são interativas.</p><label for="view">Visualização</label><select id="view"><option value="groups-compact-mobile.png">Grupos · celular</option><option value="groups-compact-desktop.png">Grupos · desktop</option><option value="groups-options-mobile.png">Ações nos três pontos · celular</option><option value="search-private-automatic-mobile.png">Busca na prévia completa · celular</option><option value="search-filter-modal-mobile.png">Modal de filtros · celular</option><option value="search-option-enabled-desktop.png">Preferência e simulação · desktop</option><option value="search-public-compact-mobile.png">Busca publicada · celular</option></select><figure><img id="capture" data-mobile="true" src="groups-compact-mobile.png" alt="Aba Links com duas linhas de navegação e ações no celular"><figcaption id="caption">Grupos · celular — captura da aplicação.</figcaption></figure><p><a href="http://localhost:3000/painel/perfil?secao=links">Abrir grupos no aplicativo local</a> · <a href="README.md">Ver validação e reversão</a></p></main>
<script>document.getElementById('view').addEventListener('change',function(){const capture=document.getElementById('capture');capture.src=this.value;capture.dataset.mobile=String(this.value.includes('mobile'));capture.alt=this.selectedOptions[0].textContent+' — captura real da implementação';document.getElementById('caption').textContent=this.selectedOptions[0].textContent+' — captura da aplicação.'})</script></html>
