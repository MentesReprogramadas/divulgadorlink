<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Minha página — versão implementada</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#edf1f6;color:#142339;font:16px/1.5 system-ui,sans-serif}main{max-width:1280px;margin:auto}h1{font-size:26px;margin:0}p{color:#526277;margin:8px 0 20px}label{font-weight:600}select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #b9c6d7;border-radius:8px;background:white;margin:0 0 20px 8px;max-width:100%}select:focus-visible,a:focus-visible{outline:3px solid #146dca;outline-offset:3px}figure{margin:0}img{display:block;width:100%;height:auto;border:1px solid #dce3ec;border-radius:12px;background:white}img[data-mobile=true]{max-width:390px;margin:auto}figcaption{margin-top:12px;color:#526277;font-size:14px}a{color:#16496c}@media(max-width:500px){body{padding:16px}select{display:block;margin:8px 0 20px;width:100%}}</style>
<main><h1>Minha página: visão geral</h1><p>Capturas reais da implementação, com dados de teste. Os controles dentro das imagens não são interativos.</p><label for="view">Visualização</label><select id="view"><option value="overview-desktop.png">Desktop</option><option value="overview-mobile.png">Celular</option><option value="overview-overflow-mobile.png">Dropdown no celular</option><option value="overview-loading-mobile.png">Carregamento no celular</option><option value="overview-320-text-200-mobile.png">320 px com texto ampliado</option></select><figure><img id="capture" src="evidencias/minha-pagina-visao-geral-2026-10-18/overview-desktop.png" alt="Visão geral no desktop, com compartilhamento, resumo e atalhos"><figcaption id="caption">Desktop — captura da aplicação em execução.</figcaption></figure><p><a href="http://localhost:3000/painel/perfil">Abrir a página local</a> · <a href="evidencias/minha-pagina-visao-geral-2026-10-18/README.md">Ver registro de validação</a></p></main>
<script>document.getElementById('view').addEventListener('change',function(){const capture=document.getElementById('capture');capture.src='evidencias/minha-pagina-visao-geral-2026-10-18/'+this.value;capture.dataset.mobile=String(this.value.includes('mobile'));capture.alt=this.selectedOptions[0].textContent+' — captura real da implementação';document.getElementById('caption').textContent=this.selectedOptions[0].textContent+' — captura da aplicação em execução.'})</script></html>
