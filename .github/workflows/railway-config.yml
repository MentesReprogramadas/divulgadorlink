name: Railway config

on:
  push:
    branches: [main]
    paths:
      - ".railway/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/railway-config.yml"
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".railway/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/railway-config.yml"

permissions:
  contents: read
  pull-requests: write
  actions: read
  id-token: write

jobs:
  plan:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    if: github.event.action == 'closed' && github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  # A action só aplica o artefato de um PR mergeado. Push direto na main
  # planeja e aplica na hora, inclusive remoção do que não está no arquivo.
  apply_main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - uses: railwayapp/config@v1
        with:
          command: plan
          comment: "false"
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
      - name: Apply this push unless a merged pull request already owns it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null)] | length' || echo 0)"
          if [ "$merged" != "0" ]; then
            echo "Commit de pull request mergeado. O job apply usa o plano pinado."
            exit 0
          fi
          ok=0
          for attempt in 1 2 3; do
            railway config plan --out railway-plan.json
            if railway config apply --plan railway-plan.json --yes --confirm-destructive; then
              ok=1
              break
            fi
            echo "Apply falhou na tentativa $attempt. O ambiente mudou depois do plano."
          done
          [ "$ok" = 1 ]

  # O CLI local está bloqueado no Windows. Este job usa o project token do
  # Actions e só grava o que ainda está vazio, para não rotacionar a senha
  # do volume do Postgres.
  bootstrap:
    needs: apply_main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.apply_main.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @railway/cli@latest
      - name: Fill empty boot settings
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          changed_pg=0
          changed_app=0
          value_of() {
            railway variable list --service "$1" --kv | sed -n "s/^$2=//p" | head -n 1
          }
          pick_host() {
            awk '
              {
                rest = $0
                while (match(rest, /https:\/\/[A-Za-z0-9.-]+/)) {
                  host = substr(rest, RSTART + 8, RLENGTH - 8)
                  rest = substr(rest, RSTART + RLENGTH)
                  if (host !~ /\.up\.railway\.app$/) custom = host
                  else if (railway == "") railway = host
                }
              }
              END { if (custom != "") print custom; else print railway }
            '
          }
          host_of() {
            railway domain list --service "$1" 2>&1 | pick_host || true
          }
          ensure_host() {
            local service="$1" host
            host="$(host_of "$service")"
            if [ -z "$host" ]; then
              host="$(railway domain --service "$service" 2>&1 | pick_host || true)"
            fi
            printf '%s' "$host"
          }
          deployment_status() {
            railway deployment list --service "$1" --limit 1 --json \
              | jq -r '.[0].status // "NONE"'
          }
          if [ -z "$(value_of postgres POSTGRES_PASSWORD)" ]; then
            pw="$(openssl rand -hex 24)"
            printf '%s' "$pw" | railway variable set POSTGRES_PASSWORD --stdin --service postgres --skip-deploys
            changed_pg=1
          fi
          api_jwt="$(value_of api JWT_SECRET)"
          worker_jwt="$(value_of worker JWT_SECRET)"
          if [ -z "$api_jwt" ] && [ -z "$worker_jwt" ]; then
            jwt="$(openssl rand -base64 48 | tr -d '\n')"
            printf '%s' "$jwt" | railway variable set JWT_SECRET --stdin --service api --skip-deploys
            printf '%s' "$jwt" | railway variable set JWT_SECRET --stdin --service worker --skip-deploys
            changed_app=1
          elif [ -z "$worker_jwt" ]; then
            printf '%s' "$api_jwt" | railway variable set JWT_SECRET --stdin --service worker --skip-deploys
            changed_app=1
          elif [ -z "$api_jwt" ]; then
            printf '%s' "$worker_jwt" | railway variable set JWT_SECRET --stdin --service api --skip-deploys
            changed_app=1
          fi
          web_host="$(ensure_host web)"
          api_host="$(ensure_host api)"
          echo "web=${web_host:-missing} api=${api_host:-missing}"
          echo "API_ORIGIN=$(value_of web API_ORIGIN)"
          if [ -z "$web_host" ]; then
            echo "O serviço web não tem domínio público."
            exit 1
          fi
          if [ -n "$web_host" ]; then
            url="https://${web_host}"
            for svc in api worker; do
              if [ -z "$(value_of "$svc" APP_PUBLIC_URL)" ]; then
                printf '%s' "$url" | railway variable set APP_PUBLIC_URL --stdin --service "$svc" --skip-deploys
                changed_app=1
              fi
            done
          fi
          echo "postgres=$(deployment_status postgres) api=$(deployment_status api) worker=$(deployment_status worker)"
          # redeploy recusa deployment removido ou ainda em build. Gravar a
          # URL de novo, sem --skip-deploys, abre um deployment novo.
          queue_deploy() {
            local service="$1" status
            status="$(deployment_status "$service")"
            case "$status" in
              SUCCESS|BUILDING|DEPLOYING|INITIALIZING) echo "$service=$status" ;;
              *)
                echo "$service=$status, enfileirando deploy"
                printf '%s' "$url" | railway variable set APP_PUBLIC_URL --stdin --service "$service"
                ;;
            esac
          }
          if [ "$changed_app" = 1 ]; then
            printf '%s' "$url" | railway variable set APP_PUBLIC_URL --stdin --service api
            printf '%s' "$url" | railway variable set APP_PUBLIC_URL --stdin --service worker
          else
            queue_deploy api
            queue_deploy worker
          fi
          pg_status="$(deployment_status postgres)"
          if [ "$changed_pg" = 1 ] || [ "$pg_status" = "FAILED" ] || [ "$pg_status" = "CRASHED" ] || [ "$pg_status" = "REMOVED" ]; then
            railway redeploy --service postgres --yes || echo "Redeploy do postgres ficou para o deploy que a senha disparar."
          fi
