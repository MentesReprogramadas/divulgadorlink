name: ci
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
# Production is deployed only after every check passes. See docs/ci-cd.md.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: divulgador
          POSTGRES_USER: divulgador
          POSTGRES_DB: divulgador
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U divulgador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Test deployment safeguards and E2E lease
        run: node --test .github/scripts/*.test.mjs frontend/e2e/run-lease.test.cjs
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
      - run: npm run lint && npm run typecheck && npm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: ci-jwt-secret-min-16
      - run: npm run test:pg
        working-directory: backend
        env:
          PG_SPECS: "1"
          AI_THRESHOLD_DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          ANALYTICS_DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          CHECKOUT_DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          SEARCH_DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          EVOLUTION_DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: ci-jwt-secret-min-16
      - run: npm run build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: ci-jwt-secret-min-16
      - run: npm audit --audit-level=high
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The E2E typecheck imports the real BullMQ adapter from the backend.
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm run build:storybook
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t divulgador-api backend
      - run: docker build -t divulgador-web frontend
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: features
            config: playwright.config.ts
          - project: features-mobile
            config: playwright.config.ts
          - project: catalog
            config: playwright.config.ts
          - project: ui-desktop
            config: playwright.visual.config.ts
          - project: ui-mobile
            config: playwright.visual.config.ts
          - project: search-desktop
            config: playwright.search.config.ts
          - project: search-mobile
            config: playwright.search.config.ts
          - project: support-desktop
            config: playwright.support.config.ts
          - project: support-mobile
            config: playwright.support.config.ts
          - project: desktop
            config: playwright.date-picker.config.ts
          - project: mobile
            config: playwright.date-picker.config.ts
    env:
      E2E_RUN_ID: f37-ci-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_PORT_OFFSET: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e -- --config=${{ matrix.config }} --project=${{ matrix.project }}
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-reports-${{ matrix.project }}
          include-hidden-files: true
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e/.runtime/server.log
          retention-days: 7
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, web, images, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: https://temlinkaqui.com
    concurrency:
      group: coolify-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy tested commit and verify health
        run: node .github/scripts/deploy-coolify.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
