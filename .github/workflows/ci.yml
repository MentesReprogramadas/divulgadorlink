name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: divulgador
          POSTGRES_USER: divulgador
          POSTGRES_DB: divulgador
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U divulgador"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6380:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
      - run: npm run lint && npm run typecheck && npm test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: ci-jwt-secret-min-16
      - run: npm run test:pg
        working-directory: backend
        env:
          PG_SPECS: "1"
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          ANALYTICS_DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          CHECKOUT_DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          SEARCH_DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: ci-jwt-secret-min-16
      - run: npm run build
        working-directory: backend
        env:
          DATABASE_URL: postgresql://divulgador:divulgador@127.0.0.1:5433/divulgador?schema=public
          REDIS_URL: redis://127.0.0.1:6380
          JWT_SECRET: ci-jwt-secret-min-16
      - run: npm audit --audit-level=high
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t divulgador-api backend
      - run: docker build -t divulgador-web frontend
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
